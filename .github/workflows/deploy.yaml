name: Deploy adelnz.com

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adelnz-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Aube and Node.js
        uses: jdx/aube-action@0fd8685e54606c8893cc05119759aa3bc925e30b # v1.1.0
        with:
          version: 2.5.1
          node-version: auto

      - name: Set up Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Install browser dependencies
        run: aube exec playwright install --with-deps chromium

      - name: Build, check, and deploy
        run: task deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload build E2E results
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-build-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error

      - name: Verify production JavaScript islands
        id: production-e2e
        run: >-
          aube exec playwright test e2e/e2e.playwright.ts
          --grep 'home timepiece island|travel stay clicks update the timeline fragment'
          --retries=3
        env:
          SITE_URL: https://adelnz.com

      - name: Upload production E2E results
        if: ${{ !cancelled() && steps.production-e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-production-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error
