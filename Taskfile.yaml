version: "3"

tasks:
  lint:
    run: once
    cmd: aube exec oxlint .
    sources:
      - .oxlintrc.jsonc
      - aube-lock.yaml
      - aube-workspace.yaml
      - "*.ts"
      - e2e/**/*.ts
      - scripts/**/*.ts
      - src/**/*
      - tooling/**/*.ts

  lint:fix:
    cmd: aube exec oxlint . --fix

  typecheck:
    run: once
    cmd: aube exec tsc -p tsconfig.json
    sources:
      - aube-lock.yaml
      - aube-workspace.yaml
      - "*.ts"
      - e2e/**/*.ts
      - scripts/**/*.ts
      - src/**/*
      - tooling/**/*.ts

  dev:
    cmd: aube exec vite --config vite.config.ts

  favicon:png:
    cmd: pkgx rsvg-convert --width 512 --height 512 --format png --output src/assets/favicon.png src/assets/favicon.svg
    sources:
      - src/assets/favicon.svg
    generates:
      - src/assets/favicon.png

  build:
    run: once
    cmd: aube exec vite build --config vite.config.ts
    sources:
      - package.json
      - aube-lock.yaml
      - aube-workspace.yaml
      - vite.config.ts
      - src/**/*
      - public/**/*
    generates:
      - dist/**/*

  test:e2e:
    run: once
    deps:
      - build
      - playwright:install
    cmd: aube exec playwright test
    sources:
      - Taskfile.yaml
      - playwright.config.ts
      - aube-lock.yaml
      - aube-workspace.yaml
      - dist/**/*
      - e2e/**/*

  test:e2e:dev:
    run: once
    deps:
      - playwright:install
    env:
      SITE_URL: http://127.0.0.1:4321
    cmd: >-
      aube node scripts/with-dev-server.ts
      aube exec playwright test
    sources:
      - Taskfile.yaml
      - playwright.config.ts
      - aube-lock.yaml
      - aube-workspace.yaml
      - e2e/**/*
      - scripts/with-dev-server.ts
      - src/**/*

  playwright:install:
    run: once
    cmd: aube exec playwright install chromium
    sources:
      - aube-lock.yaml
      - aube-workspace.yaml

  test:unit:
    run: once
    cmd: aube exec vitest run
    sources:
      - aube-lock.yaml
      - aube-workspace.yaml
      - "src/**/*.ts"
      - tooling/**/*.test.ts

  test:
    run: once
    deps:
      - test:unit
      - test:e2e

  check-impl:
    run: once
    deps:
      - lint
      - typecheck
      - test

  check:
    run: once
    cmds:
      - aube install
      - task: check-impl

  deploy:
    deps:
      - build
      - check
    cmd: aube exec wrangler pages deploy dist/ --project-name adelnz --commit-dirty=true
    sources:
      - aube-lock.yaml
      - aube-workspace.yaml
      - Taskfile.yaml
      - dist/**/*
