<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">An agent waits for CI between model turns</title>
  <desc id="desc">The model inspects a failure and pushes a fix. While the model is idle, Happen watches GitHub through gh mcp serve. A completed run wakes the saved thread. A failed run starts another repair; a passing run ends the subscription.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#69675f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#f5f3ec"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#242722">
    <text x="64" y="84" font-size="19" font-weight="600" letter-spacing="2" fill="#69675f">MCP EVENTS · CI REPAIR</text>
    <text x="64" y="145" font-size="42" font-weight="650">The model can finish its turn.</text>

    <rect x="64" y="216" width="300" height="170" rx="18" fill="#fffefa" stroke="#d6d4cb" stroke-width="2"/>
    <circle cx="96" cy="253" r="7" fill="#e09156"/>
    <text x="116" y="261" font-size="20" font-weight="600" fill="#69675f">MODEL TURN</text>
    <text x="88" y="313" font-size="26" font-weight="600">Diagnose. Fix. Push.</text>
    <text x="88" y="352" font-size="20" fill="#69675f">Subscribe before the push.</text>

    <path d="M378 301H432" fill="none" stroke="#69675f" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="448" y="216" width="300" height="170" rx="18" fill="#e8ece4" stroke="#bec9b7" stroke-width="2"/>
    <circle cx="480" cy="253" r="7" fill="#829078"/>
    <text x="500" y="261" font-size="20" font-weight="600" fill="#596552">HOST WATCH</text>
    <text x="472" y="313" font-size="30" font-weight="600">Happen + gh</text>
    <text x="472" y="352" font-size="20" fill="#596552">Model idle. CI still running.</text>

    <path d="M762 301H816" fill="none" stroke="#69675f" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="832" y="216" width="304" height="170" rx="18" fill="#fffefa" stroke="#d6d4cb" stroke-width="2"/>
    <circle cx="864" cy="253" r="7" fill="#678eae"/>
    <text x="884" y="261" font-size="20" font-weight="600" fill="#69675f">COMPLETED RUN</text>
    <text x="856" y="313" font-size="30" font-weight="600">Wake the thread.</text>
    <text x="856" y="352" font-size="20" fill="#69675f">Check the commit and result.</text>

    <path d="M984 401V461H214V401" fill="none" stroke="#69675f" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="470" y="440" width="260" height="42" rx="21" fill="#f5f3ec"/>
    <text x="600" y="468" text-anchor="middle" font-size="22" fill="#69675f">Failed → repair again</text>

    <rect x="356" y="526" width="488" height="62" rx="31" fill="#dce8d6"/>
    <path d="m388 557 8 8 15-17" fill="none" stroke="#47643d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="432" y="565" font-size="23" font-weight="600" fill="#3f5d35">Passed → unsubscribe</text>
  </g>
</svg>
