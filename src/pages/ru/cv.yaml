summaryMD: |
  14 лет работаю в разработке ПО. Руководил Android-командами в Flatstack и Infotech, разрабатывал Яндекс Поиск для Android и приложения Wheely для пассажиров и водителей. Затем основал Listenbox.

  В Flatstack нанял трёх Android-разработчиков и руководил их работой. Вместе выпустили четыре приложения с нуля. В Infotech руководил командой, которая выпустила два приложения, в том числе офлайн-приложение для бригад уличного освещения.

  Разработал и поддерживаю Listenbox, хостинг аудио- и видеоподкастов. Автоматизировал публикацию на сайте и в RSS-ленте, настроил доставку медиа через CDN и написал два MCP-сервера. Через один авторы управляют подкастами с помощью ИИ-ассистента, через другой внутренняя CRM автоматизирует холодные рассылки.

experience:
  - title: Основатель
    org:
      name: Listenbox
      url: https://listenbox.app
      imgURL: https://listenbox.app/assets/favicon-C-MTzUIS.svg
    location: Удалённо
    start: 2019-10-01
    products:
      - name: Listenbox
        url: https://listenbox.app
      - name: StrengthMCP
        url: https://strengthmcp.com/
      - name: Arrowbox
        url: https://arrowbox.co
    summaryMD: |
      Разработал и запустил Listenbox, хостинг аудио- и видеоподкастов. Написал API публикации на Go, веб-интерфейс на TypeScript и интеграции для ИИ-агентов.

      - Разработал [публичный MCP-сервер](https://listenbox.app/agents/) для управления подкастами. По просьбе автора ИИ-ассистент может создать подкаст, изменить описание или пригласить редактора.
      - Выпустил [CLI с открытым кодом](https://github.com/listenbox/client). Через него агент загружает запись, сохраняет черновик на проверку или публикует одобренный выпуск сразу после обработки.
      - Автоматизировал [публикацию сайтов подкастов](https://listenbox.app/podcast-website/). При выходе эпизода обновляются сайт и RSS-лента, а у выпуска появляется отдельная страница с плеером.
      - Настроил доставку аудио и видео через CDN с хранением в Cloudflare R2. Слушатели могли сразу включить выпуск и перемотать запись, не скачивая файл целиком. Через CDN проходило около 1 ТБ аудио в день.
      - Написал отдельный MCP-сервер для внутренней CRM. Автоматизировал поиск контактов, подготовку персональных холодных писем, отправку после одобрения и учёт ответов.
      - Написал сквозные тесты для CLI, веб-интерфейса, API, БД PostgreSQL и фоновых задач. Тесты воспроизводят обрывы загрузки и задержки внешних сервисов до релиза.
      - Настроил сквозную observability с OpenTelemetry. По трейсам от API до фоновых задач находил причины сбоев загрузки и задержек при обработке медиа.

