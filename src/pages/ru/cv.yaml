experience:
  - title: Основатель
    org:
      name: Listenbox
      url: https://listenbox.app
      imgURL: https://listenbox.app/assets/favicon-C-MTzUIS.svg
    location: Удалённо
    start: 2019-10-01
    products:
      - name: Listenbox
        url: https://listenbox.app
      - name: StrengthMCP
        url: https://strengthmcp.com/
      - name: Arrowbox
        url: https://arrowbox.co
    summaryMD: |
      Основал и развиваю Listenbox — подкаст-хостинг без внешнего финансирования. Довёл выручку от подписок до $3 тыс. в месяц.

      - Разрабатываю и поддерживаю Listenbox на Go и TypeScript
      - Реализовал загрузку, импорт и публикацию медиафайлов, биллинг, работу в командах и публичный API
      - Организовал обработку медиафайлов в Temporal с повторными попытками, отменой задач и очисткой ресурсов
      - Написал детерминированные E2E-тесты с настраиваемыми моками внешних сервисов и проверками трассировок OpenTelemetry
      - Автоматизировал развёртывание и управление инфраструктурой с помощью Terraform и Ansible
      - Отвечал за эксплуатацию и надёжность сервиса, устранение сбоев, поддержку клиентов, SEO, продажи и маркетинг

      Другие проекты:

      - Создал [StrengthMCP](https://strengthmcp.com/) — сервис, через который ИИ-ассистенты получают доступ к программам тренировок, записывают занятия и просматривают историю по протоколу MCP
      - Создал [ResponsibleAPI](https://github.com/responsibleapi/responsible) — DSL на TypeScript с компиляцией в OpenAPI 3+

