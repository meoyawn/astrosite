    summaryMD: |
      Аудио һәм видеоподкастлар өчен Listenbox хостингын бердәнбер программист буларак эшләдем һәм үстердем. Сервистан якынча 500 клиент файдаланды. Хәзер сервисның көндәлек эшен LLM агентлары башкара.

      - Беренче бэкендны Kotlin корутиналары һәм Vert.x нигезендә, PostgreSQL белән яздым һәм аны алты ел дәвамында продакшенда эшләттем, ә 2026 елда платформаны Go телендә (Echo, pgx) яңадан яздым, ачык API OpenAPI форматында тасвирланган.
      - Cloudflare R2 саклагычындагы аудио һәм видеоны CDN аша агым итеп тапшыруны көйләдем. Тыңлаучылар бөтен файлны йөкләп бетермичә тыңлый башлый һәм кирәкле урынга күчә ала. 2025 ел башында CDN аша көненә якынча 1 ТБ аудио таралды, ә Cloudflare Workers аена 16–20 миллион сорау эшкәртте.
      - OAuth аша керүле [ачык MCP серверы](https://listenbox.app/agents/) һәм шул ук API өстендә эшләүче [ачык кодлы CLI](https://github.com/listenbox/client) чыгардым. ЯИ ярдәмчеләре подкастлар белән идарә итә һәм чыгарылышларны бастыра ала.
      - [Подкаст сайтларын бастыруны](https://listenbox.app/podcast-website/) автоматлаштырдым. Яңа чыгарылыш басылгач, сайт һәм RSS тасмасы яңара, ә чыгарылыш өчен плеерлы аерым бит барлыкка килә.
      - Эчке CRM өчен аерым MCP серверы яздым. Ул яңа элемтәләрне эзләүне, һәр адресатка аерым хат әзерләүне, расланган хатларны җибәрүне һәм җавапларны теркәүне автоматлаштыра.
      - CLI, веб-интерфейс, API, PostgreSQL һәм фон биремнәрен бергә тикшерүче тестлар яздым. Алар файл йөкләү өзелгән яки тышкы сервис тоткарланган очракларны релизга кадәр тикшерә.
      - OpenTelemetry аша бөтен сервиста трассалауны көйләдем. API дан фон биремнәренә кадәр трассаларны карап, йөкләү хаталарының һәм медиа эшкәртү тоткарлыкларының сәбәбен таптым.

