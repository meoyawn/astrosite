summaryMD: |
  Программалар эшләүдә 14 ел һөнәри тәҗрибәм бар. Flatstack һәм Infotech компанияләрендә Android командаларын җитәкләдем, Яндекс Эзләү һәм Wheely өчен мобиль кушымталар эшләдем. Соңрак Listenbox сервисын эшләтеп җибәрдем.

  Flatstack компаниясендә өч Android программистын эшкә алдым һәм аларны өйрәттем. Команда дүрт кушымтаны нульдән чыгарды. Infotech компаниясендә ике кушымта чыгарган команданы җитәкләдем. Шуларның берсе урам яктырткычларын төзәтүче бригадаларга интернетсыз эшләргә мөмкинлек бирде.

  Аудио һәм видеоподкастлар өчен Listenbox хостингын бердәнбер программист буларак эшләдем һәм үстердем. Алты ел бэкендны Kotlin һәм Python телләрендә яздым, 2026 елда платформаны Go һәм TypeScript телләрендә яңадан яздым. Чыгарылышларны сайтта һәм RSS тасмасында бастыруны автоматлаштырдым, медианы CDN аша җиткерүне көйләдем һәм ике MCP серверы яздым.

